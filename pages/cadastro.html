<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0;url=../index.html#cadastro" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro</title>
  <meta name="description" content="Entre ou crie sua conta no Studyholics." />
  <link rel="icon" href="../public/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script>window.location.replace("../index.html#cadastro");</script>
</head>
<body>
      <!-- ===== TELAS: CADASTRO (3 etapas) ===== -->
    <main class="screen signup" id="signup">
    <div class="signup-inner">
      <nav class="signup-nav">
        <button class="icon-btn" type="button" id="back" aria-label="Voltar">
          <svg viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        </button>
        <ol class="progress"><li></li><li></li><li></li></ol>
      </nav>
      <div class="brand-compact">
        <img src="studyholics-mark.png" alt="" /><p class="wordmark">Study<span>holics</span></p>
      </div>

      <!-- Etapa 1 -->
      <form class="step" data-step="1" novalidate>
        <h1>Criar conta</h1>
        <p class="subtitle">Vamos começar com seus dados básicos.</p>
        <div class="fields">
          <div class="field icon user"><input name="name" placeholder="Nome" autocomplete="firstname" required minlength="2" /></div>
          <div class="field icon user"><input name="sobrenome" placeholder="Sobrenome" autocomplete="lastname" required minlength="2" /></div>
          <div class="field icon mail"><input name="email" type="email" placeholder="E-mail" autocomplete="email" required /></div>
          <div class="field icon lock password"><input name="password" type="password" placeholder="Senha" autocomplete="new-password" required minlength="8" /></div>
          <div class="field icon lock password"><input name="confirm" type="password" placeholder="Confirmar senha" autocomplete="new-password" required /></div>
        </div>
        <button class="btn" type="submit">Próximo</button>
        <a class="terms" href="#" onclick="return false">Termos e condições</a>
      </form>

      <!-- Etapa 2 -->
      <form class="step" data-step="2" novalidate hidden>
        <h1>Dados Acadêmicos</h1>
        <p class="subtitle">Vamos começar com seus dados básicos.</p>
        <div class="fields">
          <label class="field select icon cap"><span>Curso</span>
            <select name="course" required>
              <option value="">Carregando cursos…</option>
            </select>
          </label>
          <label class="field select icon calendar"><span>Semestre atual</span>
            <select name="semester" required>
              <option value="">Selecione seu semestre</option>
              <option value="1">1º</option><option value="2">2º</option><option value="3">3º</option><option value="4">4º</option><option value="5">5º</option>
              <option value="6">6º</option><option value="7">7º</option><option value="8">8º</option><option value="9">9º</option><option value="10">10º</option>
            </select>
          </label>
        </div>
        <button class="btn" type="submit">Próximo</button>
      </form>

      <!-- Etapa 3 -->
      <form class="step" data-step="3" novalidate hidden>
        <h1>Quase lá!</h1>
        <p class="subtitle">Escolha um nome de usuário e adicione uma foto de perfil</p>
        <label class="avatar" aria-label="Adicionar foto de perfil">
          <input type="file" name="photo" accept="image/*" hidden />
          <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <img alt="" hidden />
          <b>+</b>
        </label>
        <label class="field select icon user"><span>Nome de usuário</span>
          <input name="username" placeholder="Ex: felipe123" required minlength="3" maxlength="30" autocomplete="username" />
        </label>
        <button class="btn" type="submit">Finalizar</button>
        <p class="status" hidden></p>
      </form>
    </div>
  </main>
</body>
</html>
