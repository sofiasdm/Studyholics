<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studyholics - Pomodoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/pomodoro.css">
    <style>
        .campo-sessao { width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 8px; font: inherit; font-weight: 700; background: #fff; color: inherit; box-sizing: border-box; }
        #aviso { margin: 12px 0 0; text-align: center; font-weight: 700; min-height: 1.2em; }
        #aviso[data-tipo="erro"] { color: #c53030; }
        #aviso[data-tipo="info"] { color: #2c7a7b; }
    </style>
</head>
<body>

    <div class="pomodoro-container">
        <!-- TELA 1: Configurações -->
        <div id="tela-configuracao">
            <h2 class="titulo">Nova sessão</h2>
            <p class="subtitulo">Defina o que você vai estudar e por quanto tempo.</p>

            <div class="cards-topo">
                <div class="card-falso">
                    <div class="icone"></div>
                    <div class="textos">
                        <label for="sel-disciplina">Disciplina</label>
                        <select id="sel-disciplina" class="campo-sessao" required>
                            <option value="">Carregando…</option>
                        </select>
                    </div>
                </div>
                <div class="card-falso">
                    <div class="icone"></div>
                    <div class="textos">
                        <label for="input-topico">Tópico (opcional)</label>
                        <input id="input-topico" class="campo-sessao" type="text" placeholder="Ex.: Estrutura de repetição" autocomplete="off">
                    </div>
                </div>
            </div>

            <div class="config-tempos">
                <div class="input-box">
                    <label for="input-foco">Pomodoro</label>
                    <input type="number" id="input-foco" value="25" min="1" max="240">
                </div>
                <div class="input-box">
                    <label for="input-pausa-curta">Pausa curta</label>
                    <input type="number" id="input-pausa-curta" value="5" min="1">
                </div>
                <div class="input-box">
                    <label for="input-pausa-longa">Pausa longa</label>
                    <input type="number" id="input-pausa-longa" value="10" min="1">
                </div>
                <div class="input-box">
                    <label for="input-intervalo">Intervalo longa</label>
                    <input type="number" id="input-intervalo" value="4" min="1">
                </div>
            </div>
        </div>

        <!-- TELA 2: Andamento -->
        <div id="tela-andamento" style="display: none; text-align: center;">
            <h2 class="titulo">Sessão em andamento</h2>
            <p class="subtitulo" id="resumo-sessao">Mantenha o foco! Você consegue!</p>
            <h3 id="contador-sessao" style="font-size: 24px; margin-bottom: 5px;">Sessão: 1</h3>

            <button id="btn-voltar" class="btn-texto">← Voltar para configurações</button>
            <button id="btn-finalizar" class="btn-finalizar">Finalizar sessão</button>
        </div>

        <div class="area-relogio">
            <div class="circulo-timer">
                <div id="timer-display">25:00</div>
            </div>
            <button id="btn-acao" class="btn-verde">▶ Começar</button>
            <p id="aviso" role="status" aria-live="polite"></p>
        </div>
    </div>

    <script type="module" src="../js/pomodoro-pagina.js"></script>
</body>
</html>
