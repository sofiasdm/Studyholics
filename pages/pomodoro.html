<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studyholics - Pomodoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Link limpo para o novo ficheiro CSS -->
    <link rel="stylesheet" href="../css/pomodoro.css">
</head>
<body>

    <div class="pomodoro-container">
        <!-- TELA 1: Configurações -->
        <div id="tela-configuracao">
            <h2 class="titulo">Nova sessão</h2>
            <p class="subtitulo">Defina o que você vai estudar e por quanto tempo.</p>
            
            <div class="cards-topo">
                <div class="card-falso">
                    <div class="icone"></div>
                    <div class="textos">
                        <label>Disciplina</label>
                        <strong>Programação Python</strong>
                    </div>
                </div>
                <div class="card-falso">
                    <div class="icone"></div>
                    <div class="textos">
                        <label>Conteúdo</label>
                        <strong>Estrutura de repetição</strong>
                    </div>
                </div>
            </div>

            <div class="config-tempos">
                <div class="input-box">
                    <label>Pomodoro</label>
                    <input type="number" id="input-foco" value="25" min="1">
                </div>
                <div class="input-box">
                    <label>Pausa curta</label>
                    <input type="number" id="input-pausa-curta" value="5" min="1">
                </div>
                <div class="input-box">
                    <label>Pausa longa</label>
                    <input type="number" id="input-pausa-longa" value="10" min="1">
                </div>
                <div class="input-box">
                    <label>Intervalo longa</label>
                    <input type="number" id="input-intervalo" value="4" min="1">
                </div>
            </div>
        </div>

        <!-- TELA 2: Andamento -->
        <div id="tela-andamento" style="display: none; text-align: center;">
            <h2 class="titulo">Sessão em andamento</h2>
            <p class="subtitulo">Mantenha o foco! Você consegue!</p>
            <h3 id="contador-sessao" style="font-size: 24px; margin-bottom: 5px;">Sessão: 1</h3>
            
            <!-- Botão de Voltar -->
            <button id="btn-voltar" class="btn-texto">← Voltar para configurações</button>
        </div>

        <div class="area-relogio">
            <div class="circulo-timer">
                <div id="timer-display">25:00</div>
            </div>
            <button id="btn-acao" class="btn-verde">▶ Começar</button>
        </div>
    </div>

    <script src="../js/pomodoro.js"></script>
    <script>
        const display = document.getElementById('timer-display');
        const btnAcao = document.getElementById('btn-acao');
        const btnVoltar = document.getElementById('btn-voltar');
        const telaConfig = document.getElementById('tela-configuracao');
        const telaAndamento = document.getElementById('tela-andamento');
        const contadorSessao = document.getElementById('contador-sessao');

        let rodando = false;

        const pomodoro = new PomodoroTimer(
            (tempo) => display.textContent = tempo,
            (msg) => alert(msg),
            (sessaoAtual) => contadorSessao.textContent = `Sessão: ${sessaoAtual}`
        );

        btnAcao.addEventListener('click', () => {
            if (!rodando) {
                pomodoro.configurar({
                    foco: parseInt(document.getElementById('input-foco').value),
                    pausaCurta: parseInt(document.getElementById('input-pausa-curta').value),
                    pausaLonga: parseInt(document.getElementById('input-pausa-longa').value),
                    intervalosPausaLonga: parseInt(document.getElementById('input-intervalo').value)
                });
                pomodoro.iniciar();
                rodando = true;
                
                telaConfig.style.display = 'none';
                telaAndamento.style.display = 'block';
                btnAcao.innerHTML = '⏸ Pausar';
                btnAcao.style.backgroundColor = '#6c757d';
            } else {
                pomodoro.pausar();
                rodando = false;
                btnAcao.innerHTML = '▶ Continuar';
                btnAcao.style.backgroundColor = '#48bb78';
            }
        });

        // Lógica para interromper a sessão e voltar
        btnVoltar.addEventListener('click', () => {
            pomodoro.pausar();
            rodando = false;
            
            // Restaura visual do botão principal
            btnAcao.innerHTML = '▶ Começar';
            btnAcao.style.backgroundColor = '#48bb78';
            
            // Troca as telas
            telaAndamento.style.display = 'none';
            telaConfig.style.display = 'block';
            
            // Restaura o relógio para o tempo original escolhido
            const tempoFocoOriginal = document.getElementById('input-foco').value;
            display.textContent = `${tempoFocoOriginal.padStart(2, '0')}:00`;
        });
    </script>
</body>
</html>
