<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studyholics - Modo Foco</title>
    
    <!-- Liga ao vosso CSS principal para manter a mesma base -->
    <link rel="stylesheet" href="../css/global.css">
    <!-- Adicionamos alguns estilos específicos para o Pomodoro -->
    <style>
        /* Fundo azul escuro inspirado no vosso Figma */
        body {
            background-color: #1a365d; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: sans-serif;
        }

        .pomodoro-container {
            background-color: white;
            color: #1a365d; /* Texto em azul escuro */
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* O vosso logótipo no topo do painel */
        .pomodoro-logo {
            width: 80px;
            margin-bottom: 20px;
        }

        .pomodoro-title {
            margin-bottom: 5px;
            font-size: 24px;
        }

        /* Destaque para a palavra "Foco" com a cor verde água da marca */
        .highlight {
            color: #48bb78; 
        }

        .pomodoro-subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        #timer-display {
            font-size: 80px;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* Botão verde água */
        .btn-start {
            background-color: #48bb78;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            flex: 1; /* Para os botões terem a mesma largura */
        }

        /* Botão vazado azul escuro */
        .btn-pause {
            background-color: transparent;
            color: #1a365d;
            border: 2px solid #1a365d;
            padding: 10px 25px; /* Ligeiramente menor no padding por causa da borda */
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        .btn-reset {
            background: none;
            border: none;
            color: #888;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="pomodoro-container">
        <!-- Substituí o src pelo caminho correto para a vossa imagem -->
        <img src="../studyholics-mark.png" alt="Símbolo Studyholics" class="pomodoro-logo">
        
        <h1 class="pomodoro-title">Modo <span class="highlight">Foco</span></h1>
        <p class="pomodoro-subtitle">Estude. Evolua. Compartilhe.</p>
        
        <div id="timer-display">25:00</div>
        
        <div class="controls">
            <button id="btn-iniciar" class="btn-start">Iniciar</button>
            <button id="btn-pausar" class="btn-pause">Pausar</button>
        </div>
        
        <button id="btn-zerar" class="btn-reset">Zerar Ciclo</button>
    </div>

    <!-- O "cérebro" do Pomodoro -->
    <script src="../js/pomodoro.js"></script>
    
    <!-- A "cola" entre o HTML e a lógica do pomodoro.js -->
    <script>
        const relogioDisplay = document.getElementById('timer-display');
        
        // Criamos o objeto passando as funções de atualizar a tela e mostrar alerta
        const meuPomodoro = new PomodoroTimer(
            (tempoFormatado) => relogioDisplay.textContent = tempoFormatado,
            (mensagem) => alert(mensagem)
        );

        // Ligamos os cliques dos botões às ações da classe
        document.getElementById('btn-iniciar').addEventListener('click', () => meuPomodoro.iniciar());
        document.getElementById('btn-pausar').addEventListener('click', () => meuPomodoro.pausar());
        document.getElementById('btn-zerar').addEventListener('click', () => meuPomodoro.zerar());
    </script>
</body>
</html>
