<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studyholics — Editar perfil</title>
    <meta name="description" content="Atualize suas informações no Studyholics." />
    <link rel="icon" href="../assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/global.css" />

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBlue: '#0B1F44',
                        mint: '#44BBA4',
                        mintLight: '#C8EBE4',
                        pageBg: '#F4F7F6',
                        textDark: '#0B1F44',
                        textMuted: '#7a7a7a'
                    },
                    fontFamily: {
                        inter: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/pagina-inicial.css">
</head>
<body class="bg-pageBg font-inter text-textDark h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-darkBlue text-white flex-col justify-between hidden md:flex h-full relative z-20 shadow-xl">

        <div class="flex flex-col w-full">
            <!-- Logo Section -->
            <div class="p-8 flex flex-col items-center border-b border-white/10">
                <div class="w-16 h-16 mb-3 flex items-center justify-center relative overflow-hidden">
                    <img src="../assets/imagens/studyholics-mark.png" alt="logo">
                </div>
                <h1 class="text-xl font-bold tracking-wide">Study<span class="text-mint">holics</span></h1>
                <p class="text-[8px] text-white-400 mt-1 tracking-wider">Estude. Evolua. Compartilhe</p>
            </div>

            <!-- Navigation -->
            <nav class="mt-6 flex flex-col gap-2 px-4">
                <a href="pagina-inicial.html" target="_self" rel="noopener" class="flex items-center gap-4 px-4 py-3 rounded-lg text-gray-300 hover:bg-white/5 hover:text-white transition-all border-l-4 border-transparent">
                    <i class="fas fa-home w-5 text-center"></i>
                    Início
                </a>
                <a href="pomodoro.html" target="_self" rel="noopener" class="flex items-center gap-4 px-4 py-3 rounded-lg text-gray-300 hover:bg-white/5 hover:text-white transition-all border-l-4 border-transparent">
                    <i class="fas fa-book-open w-5 text-center"></i>
                    Estudar
                </a>
                <a href="grupos.html" target="_self" rel="noopener" class="flex items-center gap-4 px-4 py-3 rounded-lg text-gray-300 hover:bg-white/5 hover:text-white transition-all border-l-4 border-transparent">
                    <i class="fas fa-users w-5 text-center"></i>
                    Grupos
                </a>
                <a href="perfil.html" target="_self" rel="noopener" class="flex items-center gap-4 px-4 py-3 rounded-lg bg-gradient-to-r from-mint/100 to-transparent text-white font-semibold transition-all">
                    <i class="fas fa-user w-5 text-center"></i>
                    Perfil
                </a>
            </nav>
        </div>

        <!-- Bottom Links -->
        <div class="p-6 border-t border-white/10 flex flex-col gap-2">
            <a href="#" class="flex items-center gap-3 px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors">
                <i class="fas fa-cog w-4 text-center"></i>
                Configurações
            </a>
            <a href="#" id="btn-sair" class="flex items-center gap-3 px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors">
                <i class="fas fa-sign-out-alt w-4 text-center"></i>
                Sair
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-y-auto relative">
        <!-- Top Navbar -->
        <header class="w-full px-8 py-5 flex items-center justify-between sticky top-0 bg-pageBg/90 backdrop-blur-md z-10">
            <!-- Search -->
            <div class="relative w-full max-w-md">
                <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-textMuted"></i>
                <input type="text" placeholder="Buscar..." class="w-full bg-gray-200/60 border-none rounded-full py-2.5 pl-12 pr-4 text-sm focus:ring-2 focus:ring-mint outline-none transition-all placeholder-gray-500 font-medium">
            </div>

            <!-- Profile & Notifications -->
            <div class="flex items-center gap-5 ml-4">
                <button class="text-darkBlue hover:text-mint transition-colors relative">
                    <i class="fas fa-bell text-xl"></i>
                    <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-pageBg"></span>
                </button>
                <a href="perfil.html" class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center overflow-hidden hover:ring-2 ring-mint transition-all" aria-label="Meu perfil">
                    <i class="fas fa-user text-gray-500"></i>
                </a>
            </div>
        </header>

        <div class="px-8 pb-24 max-w-6xl mx-auto w-full flex-1">

            <a href="perfil.html" class="inline-flex items-center text-darkBlue hover:text-mint transition-colors mt-2" aria-label="Voltar ao perfil">
                <i class="fas fa-chevron-left text-xl"></i>
            </a>
            <h2 class="text-4xl font-extrabold text-darkBlue tracking-tight mt-4">Editar perfil</h2>
            <p class="text-darkBlue/80 mt-2 mb-8 font-medium">Atualize suas informações e mantenha seu perfil sempre em dia.</p>

            <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 items-start">

                <!-- Foto -->
                <div class="lg:col-span-2 bg-white rounded-3xl p-8 border border-gray-100 shadow-sm flex flex-col items-center gap-6">
                    <div class="relative w-44 h-44">
                        <div class="w-44 h-44 rounded-full bg-gray-200 overflow-hidden flex items-center justify-center">
                            <img id="avatar-img" alt="Foto de perfil" class="w-full h-full object-cover" hidden>
                            <i id="avatar-icone" class="fas fa-user text-5xl text-gray-400"></i>
                        </div>
                        <button type="button" id="btn-camera" class="absolute bottom-1 right-1 w-11 h-11 rounded-full bg-gray-300 text-darkBlue flex items-center justify-center hover:bg-mint hover:text-white transition-colors" aria-label="Alterar foto">
                            <i class="fas fa-camera"></i>
                        </button>
                    </div>
                    <button type="button" id="btn-foto" class="w-full max-w-xs border-2 border-mint text-mint font-extrabold rounded-xl py-3 hover:bg-mint hover:text-white transition-colors">
                        Alterar foto
                    </button>
                    <input type="file" id="foto" accept="image/jpeg,image/png,image/webp" hidden>
                    <p data-erro="foto" class="text-xs font-semibold text-red-600 -mt-3 min-h-[1rem] text-center" role="alert"></p>
                </div>

                <!-- Formulário -->
                <form id="form-perfil" class="lg:col-span-3 bg-white rounded-3xl p-8 border border-gray-100 shadow-sm" novalidate>
                    <div class="flex flex-col gap-3">
                        <div>
                            <label for="nome" class="block text-lg font-extrabold text-darkBlue mb-1">Nome</label>
                            <input id="nome" name="nome" type="text" maxlength="60" autocomplete="off" class="w-full bg-white border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium text-darkBlue focus:border-mint focus:ring-2 focus:ring-mint/30 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-400" disabled>
                            <p data-erro="nome" class="text-xs font-semibold text-red-600 mt-1 min-h-[1rem]" role="alert"></p>
                        </div>
                        <div>
                            <label for="sobrenome" class="block text-lg font-extrabold text-darkBlue mb-1">Sobrenome</label>
                            <input id="sobrenome" name="sobrenome" type="text" maxlength="100" autocomplete="off" class="w-full bg-white border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium text-darkBlue focus:border-mint focus:ring-2 focus:ring-mint/30 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-400" disabled>
                            <p data-erro="sobrenome" class="text-xs font-semibold text-red-600 mt-1 min-h-[1rem]" role="alert"></p>
                        </div>

                        <fieldset class="border-2 border-gray-200 rounded-2xl p-5 mt-1">
                            <legend class="px-2 text-lg font-extrabold text-darkBlue">Dados Acadêmicos</legend>
                            <div class="flex flex-col gap-3">
                        <div>
                            <label for="curso" class="block text-lg font-extrabold text-darkBlue mb-1">Curso</label>
                            <select id="curso" name="curso" class="w-full bg-white border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium text-darkBlue focus:border-mint focus:ring-2 focus:ring-mint/30 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-400" disabled>
                                <option value="">Selecione seu campus</option>
                            </select>
                            <p data-erro="curso" class="text-xs font-semibold text-red-600 mt-1 min-h-[1rem]" role="alert"></p>
                        </div>
                        <div>
                            <label for="semestre" class="block text-lg font-extrabold text-darkBlue mb-1">Período</label>
                            <select id="semestre" name="semestre" class="w-full bg-white border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium text-darkBlue focus:border-mint focus:ring-2 focus:ring-mint/30 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-400" disabled>
                                <option value="">Selecione seu período</option>
                            </select>
                            <p data-erro="semestre" class="text-xs font-semibold text-red-600 mt-1 min-h-[1rem]" role="alert"></p>
                        </div>
                        <div>
                            <label for="campus" class="block text-lg font-extrabold text-darkBlue mb-1">Campus</label>
                            <select id="campus" name="campus" class="w-full bg-white border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium text-darkBlue focus:border-mint focus:ring-2 focus:ring-mint/30 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-400" disabled>
                                <option value="">Não informar</option>
                            </select>
                            <p data-erro="campus" class="text-xs font-semibold text-red-600 mt-1 min-h-[1rem]" role="alert"></p>
                        </div>
                            </div>
                        </fieldset>
                    </div>

                    <p id="status" role="status" hidden class="mt-4 rounded-xl px-4 py-3 text-sm font-semibold"></p>

                    <div class="mt-6 flex justify-center">
                        <button type="submit" id="btn-salvar" disabled class="bg-mint hover:bg-[#3bb59d] disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold py-3 px-12 rounded-full inline-flex items-center gap-2 shadow-[0_8px_20px_rgba(76,201,176,0.35)] transition-all">
                            <i class="fas fa-floppy-disk text-sm"></i>
                            <span id="btn-salvar-texto">Salvar alterações</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Mobile Menu -->
    <div class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-3 z-30 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <a href="pagina-inicial.html" target="_self" rel="noopener" class="flex flex-col items-center gap-1 text-gray-400 hover:text-mint">
            <i class="fas fa-home text-lg"></i>
            <span class="text-[10px] font-semibold">Início</span>
        </a>
        <a href="pomodoro.html" target="_self" rel="noopener" class="flex flex-col items-center gap-1 text-gray-400 hover:text-mint">
            <i class="fas fa-book-open text-lg"></i>
            <span class="text-[10px] font-semibold">Estudar</span>
        </a>
        <a href="grupos.html" target="_self" rel="noopener" class="flex flex-col items-center gap-1 text-gray-400 hover:text-mint">
            <i class="fas fa-users text-lg"></i>
            <span class="text-[10px] font-semibold">Grupos</span>
        </a>
        <a href="perfil.html" target="_self" rel="noopener" class="flex flex-col items-center gap-1 text-mint">
            <i class="fas fa-user text-lg"></i>
            <span class="text-[10px] font-semibold">Perfil</span>
        </a>
    </div>

    <script type="module" src="../js/editar-perfil.js"></script>
</body>
</html>
